<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chiki Store</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

body {
  background: #f5f5f5;
}

header {
  background: #2874f0;
  color: white;
  text-align: center;
  padding: 20px;
}

header h1 {
  font-size: 30px;
}

header p {
  margin-top: 8px;
}

.products {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 20px;
  padding: 20px;
}

.product {
  background: white;
  padding: 15px;
  border-radius: 10px;
  text-align: center;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

.product img {
  width: 100%;
  height: 180px;
  object-fit: contain;
}

.product h3 {
  margin: 10px 0;
}

.product p {
  color: #555;
  margin-bottom: 10px;
}

button {
  background: #ff9f00;
  color: white;
  border: none;
  padding: 10px 18px;
  border-radius: 5px;
  font-size: 16px;
}

footer {
  background: #172337;
  color: white;
  text-align: center;
  padding: 20px;
  margin-top: 20px;
}
</style>
</head>

<body>

<header>
<h1>🛒 Chiki Store</h1>
<p>Best Products • Best Deals • Shop Online</p>
</header>

<section class="products">

<div class="product">
<img src="https://via.placeholder.com/300">
<h3>Product 1</h3>
<p>Best Quality Product</p>
<button>View Deal</button>
</div>

<div class="product">
<img src="https://via.placeholder.com/300">
<h3>Product 2</h3>
<p>Amazing Offer Available</p>
<button>View Deal</button>
</div>

<div class="product">
<img src="https://via.placeholder.com/300">
<h3>Product 3</h3>
<p>Popular Product</p>
<button>View Deal</button>
</div>

</section>

<footer>
<p>© 2026 Chiki Store | Best Online Deals</p>
</footer>

</body>
</html>
